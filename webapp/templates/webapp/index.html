<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>{{ shop.name }}</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --danger: #d64545;
    --radius: 14px;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
  header { padding: 18px 16px 8px; }
  header h1 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--hint); font-size: 14px; }
  .closed { margin: 8px 16px; padding: 10px 12px; border-radius: 10px; background: var(--card); color: var(--danger); font-size: 14px; }
  nav { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; background: var(--bg); scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button { flex: none; border: 0; border-radius: 999px; padding: 8px 14px; background: var(--card); color: var(--text); font: inherit; font-size: 14px; }
  nav button.on { background: var(--accent); color: var(--accent-text); }
  section h2 { margin: 18px 16px 6px; font-size: 18px; }
  .item { display: flex; gap: 12px; padding: 12px 16px; align-items: center; }
  .item img, .item .ph { width: 76px; height: 76px; border-radius: var(--radius); object-fit: cover; background: var(--card); flex: none; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; }
  .item .desc { color: var(--hint); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .price { margin-top: 2px; }
  .qty { display: flex; align-items: center; gap: 10px; }
  .qty button, .add { border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-text); font: inherit; }
  .qty button { width: 34px; height: 34px; font-size: 20px; line-height: 1; }
  .add { padding: 8px 16px; font-weight: 600; }
  .qty span { min-width: 18px; text-align: center; font-weight: 600; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--bg); display: none; }
  #bar button, .primary { width: 100%; border: 0; border-radius: var(--radius); padding: 14px; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; }
  .primary:disabled { opacity: .5; }
  #sheet { position: fixed; inset: 0; z-index: 10; display: none; overflow-y: auto; background: var(--bg); padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  #sheet h3 { margin: 18px 0 8px; font-size: 15px; color: var(--hint); font-weight: 500; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { flex: 1 1 40%; text-align: center; padding: 10px; border-radius: 10px; background: var(--card); }
  .seg input { display: none; }
  .seg input:checked + span { color: var(--accent); font-weight: 700; }
  .seg label:has(input:checked) { outline: 2px solid var(--accent); }
  input[type=text], input[type=tel], textarea { width: 100%; padding: 12px; border: 0; border-radius: 10px; background: var(--card); color: var(--text); font: inherit; }
  .ghost { border: 0; background: var(--card); color: var(--text); padding: 10px 14px; border-radius: 10px; font: inherit; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 8px 0; }
  .total { font-size: 18px; font-weight: 700; }
  .done { text-align: center; padding: 64px 16px; }
  .done h2 { font-size: 26px; margin: 0 0 8px; }
</style>
</head>
<body>
<header><h1 id="title">{{ shop.name }}</h1><p id="sub"></p></header>
<div id="closed" class="closed" hidden></div>
<div id="notice" class="closed" hidden></div>
<nav id="cats"></nav>
<main id="list"></main>
<div id="bar"><button id="barBtn"></button></div>

<div id="sheet">
  <div class="row"><strong style="font-size:20px">Buyurtma</strong><button class="ghost" id="close">Yopish</button></div>
  <div id="lines"></div>
  <div id="deliveryBlock"><h3>Buyurtma turi</h3><div class="seg" id="dtypes"></div></div>
  <div id="addrBlock">
    <h3>Manzil</h3>
    <button class="ghost" id="locBtn" type="button">📍 Lokatsiyani yuborish</button>
    <p id="locInfo" style="color:var(--hint);font-size:13px;margin:6px 0"></p>
    <textarea id="address" rows="2" placeholder="Ko'cha, uy, mo'ljal"></textarea>
  </div>
  <h3>Telefon</h3><input type="tel" id="phone" placeholder="+998 90 123 45 67" autocomplete="tel">
  <h3>To'lov usuli</h3><div class="seg" id="pmethods"></div>
  <h3>Izoh</h3><input type="text" id="comment" placeholder="Masalan: achchiq bo'lmasin" maxlength="200">
  <div style="margin-top:18px">
    <div class="row"><span>Mahsulotlar</span><span id="sSub"></span></div>
    <div class="row" id="feeRow"><span>Yetkazish</span><span id="sFee"></span></div>
    <div class="row total"><span>Jami</span><span id="sTotal"></span></div>
  </div>
  <div class="err" id="err"></div>
  <button class="primary" id="submit">Buyurtma berish</button>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const BASE = location.pathname.replace(/\/$/, "");
const $ = (id) => document.getElementById(id);
const st = { shop: null, cats: [], products: {}, cart: {}, dtype: null, pmethod: null, lat: null, lng: null, quote: null };

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) el.append(kid instanceof Node ? kid : document.createTextNode(kid ?? ""));
  return el;
}
const money = (n) => Number(n).toLocaleString("ru-RU").replace(/\u00a0|\u202f/g, " ") + " " + st.shop.currency;
const count = () => Object.values(st.cart).reduce((a, b) => a + b, 0);
const subtotal = () => Object.entries(st.cart).reduce((s, [id, q]) => s + st.products[id].price * q, 0);

async function api(path, body, headers = {}) {
  const res = await fetch(BASE + path, body ? { method: "POST", headers: { "Content-Type": "application/json", ...headers }, body: JSON.stringify(body) } : {});
  const data = await res.json().catch(() => ({ ok: false, error: "Server javob bermadi" }));
  return { status: res.status, data };
}

async function load() {
  const { data } = await api("/api/menu/");
  st.shop = data.shop; st.cats = data.categories;
  for (const c of st.cats) for (const p of c.products) st.products[p.id] = p;
  $("title").textContent = st.shop.name;
  $("sub").textContent = [st.shop.hours && "Ish vaqti " + st.shop.hours, st.shop.phone].filter(Boolean).join(" · ");
  if (!st.shop.is_open) { $("closed").hidden = false; $("closed").textContent = "Hozir yopiqmiz. Ish vaqti: " + st.shop.hours; }
  if (!tg || !tg.initData) {
    $("notice").hidden = false;
    $("notice").textContent = "Buyurtma berish uchun Mini App'ni botdagi «Buyurtma» tugmasi orqali oching.";
  }
  renderMenu(); renderBar();
}

function renderMenu() {
  const nav = $("cats"), list = $("list");
  nav.replaceChildren(); list.replaceChildren();
  if (!st.cats.length) list.append(h("p", { style: "padding:24px 16px;color:var(--hint)" }, "Menyu hali to'ldirilmagan."));
  st.cats.forEach((c, i) => {
    nav.append(h("button", { class: i === 0 ? "on" : "", onclick: (e) => {
      $("sec" + c.id).scrollIntoView({ behavior: "smooth", block: "start" });
      nav.querySelectorAll("button").forEach((b) => b.classList.remove("on")); e.currentTarget.classList.add("on");
    } }, c.name));
    const sec = h("section", { id: "sec" + c.id, style: "scroll-margin-top:52px" }, h("h2", {}, c.name));
    for (const p of c.products) sec.append(itemRow(p));
    list.append(sec);
  });
}

function itemRow(p) {
  const q = st.cart[p.id] || 0;
  const control = q === 0
    ? h("button", { class: "add", onclick: () => setQty(p.id, 1) }, "Qo'shish")
    : h("div", { class: "qty" }, h("button", { onclick: () => setQty(p.id, q - 1) }, "−"), h("span", {}, q), h("button", { onclick: () => setQty(p.id, q + 1) }, "+"));
  return h("div", { class: "item", id: "item" + p.id },
    p.image ? h("img", { src: p.image, alt: "", loading: "lazy" }) : h("div", { class: "ph" }),
    h("div", { class: "info" }, h("div", { class: "name" }, p.name), p.description ? h("div", { class: "desc" }, p.description) : "", h("div", { class: "price" }, money(p.price))),
    control);
}

function setQty(id, q) {
  q = Math.max(0, Math.min(q, 50));
  if (q === 0) delete st.cart[id]; else st.cart[id] = q;
  const old = $("item" + id); if (old) old.replaceWith(itemRow(st.products[id]));
  renderBar();
  if ($("sheet").style.display === "block") { renderSheet(); }
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

function renderBar() {
  const n = count();
  $("bar").style.display = n ? "block" : "none";
  $("barBtn").textContent = n ? `Savat · ${n} ta · ${money(subtotal())}` : "";
}

$("barBtn").onclick = () => { $("sheet").style.display = "block"; initSheet(); };
$("close").onclick = () => { $("sheet").style.display = "none"; };

function radios(box, name, options, current, onchange) {
  box.replaceChildren();
  for (const o of options) {
    const input = h("input", { type: "radio", name, value: o.code });
    if (o.code === current) input.checked = true;
    input.addEventListener("change", () => onchange(o.code));
    box.append(h("label", {}, input, h("span", {}, o.label)));
  }
}

function initSheet() {
  const dl = { delivery: "🚚 Yetkazib berish", pickup: "🏃 Olib ketaman" };
  const types = st.shop.delivery_types;
  if (!st.dtype || !types.includes(st.dtype)) st.dtype = types[0];
  if (!st.pmethod || !st.shop.payment_methods.some((m) => m.code === st.pmethod)) st.pmethod = (st.shop.payment_methods[0] || {}).code;
  $("deliveryBlock").hidden = types.length < 2;
  radios($("dtypes"), "dtype", types.map((c) => ({ code: c, label: dl[c] })), st.dtype, (v) => { st.dtype = v; renderSheet(); });
  radios($("pmethods"), "pm", st.shop.payment_methods, st.pmethod, (v) => { st.pmethod = v; });
  renderSheet();
}

async function renderSheet() {
  const lines = $("lines"); lines.replaceChildren();
  for (const [id, q] of Object.entries(st.cart)) {
    const p = st.products[id];
    lines.append(h("div", { class: "row" }, h("span", {}, p.name),
      h("div", { class: "qty" }, h("button", { onclick: () => setQty(+id, q - 1) }, "−"), h("span", {}, q), h("button", { onclick: () => setQty(+id, q + 1) }, "+")),
      h("span", {}, money(p.price * q))));
  }
  if (!count()) { $("sheet").style.display = "none"; return; }
  const delivery = st.dtype === "delivery";
  $("addrBlock").hidden = !delivery; $("feeRow").hidden = !delivery;
  $("sSub").textContent = money(subtotal());
  await refreshQuote();
}

let quoteSeq = 0;
async function refreshQuote() {
  const seq = ++quoteSeq;
  const { data } = await api("/api/quote/", { items: items(), delivery_type: st.dtype, lat: st.lat, lng: st.lng });
  if (seq !== quoteSeq) return;
  st.quote = data.ok ? data : null;
  $("err").textContent = data.ok ? "" : data.error;
  $("sFee").textContent = data.ok ? money(data.delivery_fee) : "—";
  $("sTotal").textContent = data.ok ? money(data.total) : money(subtotal());
  $("submit").disabled = !data.ok;
}

const items = () => Object.entries(st.cart).map(([id, qty]) => ({ id: +id, qty }));

$("locBtn").onclick = () => {
  const ok = (lat, lng) => { st.lat = lat; st.lng = lng; $("locInfo").textContent = "Lokatsiya olindi ✓"; renderSheet(); };
  const fail = () => { $("locInfo").textContent = "Lokatsiyani olib bo'lmadi. Ruxsatni tekshiring yoki manzilni yozing."; };
  const browser = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition((p) => ok(p.coords.latitude, p.coords.longitude), fail, { enableHighAccuracy: true, timeout: 10000 }) : fail();
  const lm = tg && tg.LocationManager;
  if (lm) lm.init(() => lm.isLocationAvailable ? lm.getLocation((l) => (l ? ok(l.latitude, l.longitude) : browser())) : browser());
  else browser();
};

$("submit").onclick = async () => {
  $("err").textContent = "";
  const phone = $("phone").value.trim();
  if (!/^\+?[\d\s\-()]{9,18}$/.test(phone)) { $("err").textContent = "Telefon raqamini to'g'ri kiriting."; return; }
  if (st.dtype === "delivery" && !$("address").value.trim() && st.lat === null) { $("err").textContent = "Manzilni yozing yoki lokatsiya yuboring."; return; }
  $("submit").disabled = true;
  const { status, data } = await api("/api/order/", {
    items: items(), delivery_type: st.dtype, payment_method: st.pmethod, phone, address: $("address").value,
    lat: st.lat, lng: st.lng, comment: $("comment").value,
  }, { "X-Telegram-Init-Data": tg ? tg.initData : "" });
  if (!data.ok) { $("err").textContent = data.error || "Xatolik. Qayta urinib ko'ring."; $("submit").disabled = status === 401; return; }
  const sheet = $("sheet"); sheet.replaceChildren(h("div", { class: "done" }, h("h2", {}, `Buyurtma #${data.number} qabul qilindi`), h("p", { style: "color:var(--hint)" }, "Holati haqida bot orqali xabar beramiz.")));
  if (data.pay_url) {
    const pay = h("button", { class: "primary", style: "margin-top:16px", onclick: () => (tg ? tg.openLink(data.pay_url) : window.open(data.pay_url, "_blank")) }, "💳 To'lash");
    sheet.firstChild.append(pay);
  } else if (tg) { setTimeout(() => tg.close(), 1800); }
};

load();
</script>
</body>
</html>
